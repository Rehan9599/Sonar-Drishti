services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ../backend
    env_file: ../.env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  celery-worker:
    build: ../backend
    command: celery -A drishti_api worker -l info
    env_file: ../.env
    depends_on: [backend, redis]

  frontend:
    build: ../frontend
    ports: ["5173:5173"]
    depends_on: [backend]
